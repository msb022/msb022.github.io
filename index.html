<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MasjidApps - Digital prayer times for mosques.">

  <!-- Enhanced TV/Console Browser Compatibility -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Permissions-Policy" content="geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)">

  <!-- Performance and Compatibility -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">

  <!-- Fallback for older browsers -->
  <script>
    if (!window.Promise) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8/dist/polyfill.min.js"><\/script>');
    }
    if (!window.fetch) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.2/dist/fetch.umd.min.js"><\/script>');
    }

    if (navigator.userAgent.includes('PlayStation') || navigator.userAgent.includes('PS4')) {
      console.log('PS4 Browser detected - applying optimizations');
      document.documentElement.classList.add('ps4-browser');
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MasjidApps">
  <link rel="apple-touch-icon" href="masjid_apps_logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="masjid_apps_logo.png"/>

  <title>MasjidApps</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B5C4B;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .loading {
      color: white;
      font-size: 24px;
      text-align: center;
    }

    .loading img {
      width: 120px;
      height: auto;
      margin-bottom: 16px;
      border-radius: 12px;
      background: white;
      padding: 8px;
    }

    .ps4-browser .loading {
      font-size: 32px;
    }

    .flutter-ready .loading {
      display: none;
    }
  </style>
</head>
<body>
  <div class="loading">
    <img src="masjid_apps_logo.png" alt="MasjidApps">
    <div>Loading MasjidApps...</div>
    <div style="font-size: 16px; margin-top: 10px;">Please wait</div>
  </div>

  <script>
    (function () {
      // Clear stale caches once per build. Do not reload in a loop — that made
      // phones look like the link would not open.
      var APP_BUILD = '1.3.27+35';
      var clearedKey = 'masjidapps-build';
      var onceKey = 'masjidapps-clearing';
      try {
        if (sessionStorage.getItem(onceKey) === APP_BUILD) return;
        if (localStorage.getItem(clearedKey) === APP_BUILD) return;
        sessionStorage.setItem(onceKey, APP_BUILD);
        localStorage.setItem(clearedKey, APP_BUILD);
      } catch (e) {}
      var clearCaches = function () {
        if (!window.caches) return Promise.resolve();
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (key) { return caches.delete(key); }));
        });
      };
      var unregister = function () {
        if (!('serviceWorker' in navigator)) return Promise.resolve();
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        });
      };
      unregister().then(clearCaches).catch(function () {});
    })();
  </script>
  <script>
    let flutterReady = false;
    let loadingTimeout;
    let errorTimeout;

    function hideLoading() {
      if (!flutterReady) {
        flutterReady = true;
        document.body.classList.add('flutter-ready');
        console.log('Flutter app ready - hiding loading screen');
        if (loadingTimeout) clearTimeout(loadingTimeout);
        if (errorTimeout) clearTimeout(errorTimeout);
      }
    }

    function showError(message) {
      console.error('Flutter loading error:', message);
      const loadingDiv = document.querySelector('.loading');
      if (loadingDiv) {
        loadingDiv.innerHTML = `
          <div style="color: white; text-align: center;">
            <div style="font-size: 24px; margin-bottom: 10px;">⚠️ Loading Error</div>
            <div style="font-size: 16px;">${message}</div>
            <div style="font-size: 14px; margin-top: 10px;">Please refresh or try a different browser</div>
          </div>
        `;
      }
    }

    window.addEventListener('load', function() {
      console.log('Page loaded');
      loadingTimeout = setTimeout(hideLoading, 5000);
      errorTimeout = setTimeout(() => {
        if (!flutterReady) {
          showError('App is taking too long to load. This may be due to a slow connection or incompatible browser.');
        }
      }, 15000);
    });

    window.addEventListener('flutter-first-frame', function() {
      console.log('Flutter first frame rendered');
      hideLoading();
    });

    window.addEventListener('error', function(e) {
      console.error('JavaScript error:', e.error);
      if (!flutterReady && e.message && e.message.includes('flutter')) {
        showError('JavaScript error occurred. Please refresh the page.');
      }
    });

    setTimeout(function() {
      if (!flutterReady) {
        console.warn('Flutter taking longer than expected - hiding loading screen anyway');
        hideLoading();
      }
    }, 10000);
  </script>

  <script src="build_optimization.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
